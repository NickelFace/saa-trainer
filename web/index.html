<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAA-C03 Trainer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#10151c">
<meta name="description" id="meta-description" content="Офлайн-тренажёр и учебник для экзамена AWS Certified Solutions Architect – Associate (SAA-C03)">
</head>
<body>
<header class="topbar">
  <div class="brand">SAA-C03 <span>trainer</span></div>
  <nav class="tabs">
    <button class="tab" data-view="practice">Тренировка</button>
    <button class="tab" data-view="exam">Экзамен</button>
    <button class="tab" data-view="theory">Учебник</button>
    <button class="tab" data-view="progress">Прогресс</button>
  </nav>
  <div class="bank-info" id="bank-info"></div>
  <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main id="root">
  <!-- ТРЕНИРОВКА / PRACTICE -->
  <section class="view" id="view-practice">
    <div class="filters-bar">
      <button class="btn ghost filters-toggle" id="f-toggle" aria-expanded="true" aria-controls="practice-filters">Фильтры</button>
      <span class="filters-summary" id="f-summary"></span>
      <span class="chapter-filter hidden" id="chapter-filter"></span>
    </div>
    <div class="filters" id="practice-filters">
      <label><span id="lbl-dom">Домен</span>
        <select id="f-dom"><option value="" id="opt-dom-all">все</option></select>
      </label>
      <label><span id="lbl-svc">Сервис</span>
        <select id="f-svc"><option value="" id="opt-svc-all">все</option></select>
      </label>
      <label><span id="lbl-status">Статус</span>
        <select id="f-status">
          <option value="all" id="opt-status-all">все</option>
          <option value="unseen" id="opt-status-unseen">не отвеченные</option>
          <option value="wrong" id="opt-status-wrong">ошибочные</option>
          <option value="correct" id="opt-status-correct">решённые верно</option>
          <option value="flagged" id="opt-status-flagged">отмеченные</option>
          <option value="corrected" id="opt-status-corrected">исправленный ключ</option>
          <option value="disputed" id="opt-status-disputed">спорные</option>
          <option value="manual" id="opt-status-manual">домен размечен вручную</option>
        </select>
      </label>
      <label><span id="lbl-order">Порядок</span>
        <select id="f-order">
          <option value="id" id="opt-order-id">по номеру</option>
          <option value="random" id="opt-order-random">случайно</option>
        </select>
      </label>
      <label><span id="lbl-search">Поиск</span>
        <input type="search" id="f-find" placeholder="номер вопроса или текст">
      </label>
      <button class="btn" id="f-apply">Применить</button>
    </div>
    <div class="practice-body">
      <div id="practice-empty" class="empty hidden">Под фильтр ничего не подходит.</div>
      <div id="practice-card"></div>
    </div>
  </section>

  <!-- ЭКЗАМЕН / EXAM -->
  <section class="view hidden" id="view-exam">
    <div id="exam-start" class="panel">
      <h2 id="exam-title">Экзамен</h2>
      <p id="exam-intro">65 вопросов по весам blueprint, таймер 130 минут. Разбор — после сдачи.</p>
      <div class="plan" id="exam-plan"></div>
      <label class="checkbox"><input type="checkbox" id="exam-exclude-seen"> <span id="lbl-exam-exclude">Исключить вопросы, на которые уже отвечал верно</span></label>
      <button class="btn primary" id="exam-begin">Начать экзамен</button>
      <div id="exam-resume" class="hidden">
        <p class="warn" id="exam-warn">Есть незавершённая попытка.</p>
        <button class="btn" id="exam-continue">Продолжить</button>
        <button class="btn ghost" id="exam-drop">Сбросить</button>
      </div>
    </div>
    <div id="exam-run" class="hidden">
      <div class="exam-bar">
        <span id="exam-counter"></span>
        <span id="exam-timer" class="timer"></span>
        <button class="btn ghost" id="exam-finish">Завершить</button>
      </div>
      <div id="exam-card"></div>
      <div class="exam-grid" id="exam-grid"></div>
    </div>
    <div id="exam-result" class="hidden"></div>
  </section>

  <!-- УЧЕБНИК / HANDBOOK -->
  <section class="view hidden" id="view-theory">
    <div class="theory-layout">
      <aside class="theory-list">
        <input type="search" id="theory-search" placeholder="Поиск по учебнику">
        <ul id="theory-index"></ul>
      </aside>
      <article class="theory-body" id="theory-body">
        <div class="empty" id="theory-initial-empty">Выберите главу из списка.</div>
      </article>
    </div>
  </section>

  <!-- ПРОГРЕСС / PROGRESS -->
  <section class="view hidden" id="view-progress">
    <div id="progress-body"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="data/bank.js"></script>
<script src="data/theory.js"></script>
<script src="data/theory.en.js"></script>
<script src="data/explain.js"></script>
<script src="data/explain.en.js"></script>
<script src="js/storage.js"></script>
<script src="js/quiz.js"></script>
<script src="js/theory.js"></script>
<script src="js/app.js"></script>
<script src="js/native.js"></script>
</body>
</html>
