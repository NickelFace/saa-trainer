name: Deploy to saa.maks.top

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # банк и учебник собираются из исходников, а не берутся из коммита:
      # сайт не может разъехаться с data/*.json
      - name: Собрать банк, учебник и данные приложения
        run: bash scripts/build.sh

      # если артефакты в репозитории отстали от исходников, деплой это не ломает
      # (сайт всё равно собран из исходников), но знать об этом надо
      - name: Проверить, что артефакты в репозитории не отстали
        continue-on-error: true
        run: git diff --exit-code -- data web/data docs

      - name: Собрать статику сайта
        run: bash scripts/build-site.sh site "${GITHUB_SHA::12}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
