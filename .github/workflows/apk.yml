name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Тип сборки"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Установить Capacitor
        working-directory: mobile
        run: npm ci

      # веб-часть приложения собирается из web/ тем же скриптом, что и локально
      - name: Собрать веб-часть и синхронизировать проект
        working-directory: mobile
        run: |
          npm run www
          npx cap sync android

      # ключ подписи лежит в секретах репозитория в виде base64 и живёт
      # только внутри задания: в артефакт и в логи он не попадает
      - name: Подготовить ключ подписи
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::секрет ANDROID_KEYSTORE_BASE64 не задан — release соберётся неподписанным"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saa.keystore"
          echo "SAA_KEYSTORE=$RUNNER_TEMP/saa.keystore" >> "$GITHUB_ENV"

      - name: Собрать APK
        working-directory: mobile/android
        env:
          SAA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # подпись проверяется явно: неподписанный release не установится на телефон
      - name: Проверить подпись
        if: inputs.variant == 'release'
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          if "$SIGNER" verify --print-certs "$APK"; then
            echo "APK подписан"
          else
            echo "::warning::APK не подписан — задайте секреты ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
          fi

      - name: Путь к debug APK
        if: inputs.variant != 'release'
        run: echo "APK_PATH=mobile/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: saa-trainer-${{ inputs.variant }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
